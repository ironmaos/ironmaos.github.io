<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRONMAOS 资源下载</title>
    <style>
        /* ====== 哲风壁纸风格暗黑主题变量 ====== */
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1c;
            --card-border: #2a2a2a;
            --text-main: #f5f5f5;
            --text-sub: #888888;
            --item-bg: #242424;
            --item-hover: #2e2e2e;
            --btn-bg: #ffffff;
            --btn-text: #121212;
            --btn-hover: #e0e0e0;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .container {
            max-width: 760px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 40px;
            color: var(--text-main);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .download-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
        }

        .download-section h2 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-item:hover {
            background: var(--item-hover);
            border-color: #333333;
            transform: translateY(-2px);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .file-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: #111111;
            border-radius: 50%;
            flex-shrink: 0;
            color: white;
        }

        .file-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #fff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .file-name {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-left: 10px;
            flex-shrink: 0;
        }

        .download-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 24px;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .download-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.04);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        /* ====== 底部区域 ====== */
        .footer {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--text-sub);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .sponsor-text {
            font-size: 0.85rem;
            color: #a1a1a6;
        }

        /* 给赞助者名字一个高级的淡金色 */
        .sponsor-name {
            color: #e5c07b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 手机端专属响应式布局 */
        @media screen and (max-width: 600px) {
            body {
                padding: 20px 12px;
            }
            .main-title {
                font-size: 2.8rem;
                letter-spacing: -1px;
                margin-bottom: 25px;
            }
            .download-section {
                padding: 20px 16px;
                border-radius: 20px;
            }
            .download-section h2 {
                margin-bottom: 16px;
            }
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
                gap: 14px;
            }
            .file-info {
                width: 100%;
                justify-content: flex-start;
            }
            .file-name {
                flex: 1;
            }
            .download-btn {
                width: 100%;
                padding: 12px 0;
                font-size: 1rem;
                border-radius: 12px;
            }
            .file-item:hover {
                transform: none;
            }
        }
    </style>
</head>

</html>

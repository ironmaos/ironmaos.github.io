<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRONMAOS 资源下载</title>
    <style>
        /* ====== 苹果设计系统变量 ====== */
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --item-bg: rgba(255, 255, 255, 0.5);
            --item-hover: rgba(255, 255, 255, 0.9);
            --btn-bg: #007aff;
            --btn-hover: #0071e3;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 16px 50px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
                --card-bg: rgba(30, 30, 30, 0.65);
                --card-border: rgba(255, 255, 255, 0.1);
                --text-main: #f5f5f7;
                --text-sub: #a1a1a6;
                --item-bg: rgba(255, 255, 255, 0.05);
                --item-hover: rgba(255, 255, 255, 0.12);
                --btn-bg: #0a84ff;
                --btn-hover: #409cff;
                --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
                --shadow-hover: 0 16px 50px rgba(0, 0, 0, 0.7);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .container {
            max-width: 760px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .main-title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 40px;
            color: var(--text-main);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .download-section {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            padding: 30px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: box-shadow 0.4s ease, background 0.4s ease;
        }

        .download-section:hover {
            box-shadow: var(--shadow-hover);
        }

        .download-section h2 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            padding: 14px 20px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-item:hover {
            background: var(--item-hover);
            transform: scale(1.015) translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        .file-icon {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: rgba(120, 120, 128, 0.12);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .file-name {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-left: 10px;
            flex-shrink: 0;
        }

        .download-btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .download-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.04);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 35px;
            color: var(--text-sub);
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* =======================================================
           手机端专属响应式布局
           ======================================================= */
        @media screen and (max-width: 600px) {
            body {
                padding: 20px 12px;
            }
            .main-title {
                font-size: 2.8rem;
                letter-spacing: -1px;
                margin-bottom: 25px;
            }
            .download-section {
                padding: 20px 16px;
                border-radius: 22px;
            }
            .download-section h2 {
                margin-bottom: 16px;
            }
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
                gap: 14px;
            }
            .file-info {
                width: 100%;
                justify-content: flex-start;
            }
            .file-name {
                flex: 1;
            }
            .download-btn {
                width: 100%;
                padding: 12px 0;
                font-size: 1rem;
                border-radius: 12px;
            }
            .file-item:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ====== 顶部大标题 ====== -->
        <div class="main-title">IRONMAOS</div>

        <!-- ====== 下载区域 ====== -->

                    <a href="./photon-main.zip" class="download-btn" download>下载</a>
                </div>

                <!-- 压缩包 2 -->

                    </div>

                <!-- 压缩包 3 -->

                </div>

                <!-- 压缩包 4：Needs of Nature.zip（新增） -->
                <div class="file-item">

                        <span class="file-icon">📦</span>

                    </div>
                    <a href="./Needs%20of%20Nature.zip" class="download-btn" download>下载</a>
                </div>

            </div>
        </div>

        <div class="footer">
            <p>IRONMAOS · 资源分享站</p>
        </div>

    </div>
</body>
</html>
